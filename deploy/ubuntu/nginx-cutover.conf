server {
    listen 80;
    server_name imagemeow.top;
    location ^~ /.well-known/acme-challenge/ { root /var/www/image-meow-acme; }
    location / { return 301 https://imagemeow.top$request_uri; }
}
server {
    listen 443 ssl;
    server_name imagemeow.top;
    ssl_certificate /etc/letsencrypt/live/imagemeow.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imagemeow.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;
    client_body_timeout 120s;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host imagemeow.top;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
server {
    listen 80;
    server_name preview.imagemeow.top;
    location ^~ /.well-known/acme-challenge/ { root /var/www/image-meow-acme; }
    location / { return 301 https://imagemeow.top$request_uri; }
}
server {
    listen 443 ssl;
    server_name preview.imagemeow.top;
    ssl_certificate /etc/letsencrypt/live/preview.imagemeow.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.imagemeow.top/privkey.pem;
    return 301 https://imagemeow.top$request_uri;
}
